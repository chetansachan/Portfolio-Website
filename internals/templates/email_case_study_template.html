<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Case Study: {{.CaseStudy.Case_Study_Title}}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        table {
            border-spacing: 0;
            border-collapse: collapse;
            width: 100%;
        }
        td {
            padding: 0;
        }
        img {
            border: 0;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }
        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f8fafc;
            padding-bottom: 40px;
        }
        .main-table {
            background-color: #ffffff;
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }
        .header-bar {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 40px 20px;
            text-align: center;
        }
        .header-title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .header-subtitle {
            color: #d1fae5;
            font-size: 14px;
            margin: 8px 0 0 0;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .content-body {
            padding: 40px 32px;
        }
        .post-label {
            display: inline-block;
            background-color: #d1fae5;
            color: #065f46;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 9999px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .post-title {
            color: #0f172a;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
            margin: 0 0 16px 0;
        }
        .post-description {
            color: #475569;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 32px 0;
        }
        .cta-container {
            text-align: center;
            margin-bottom: 16px;
        }
        .cta-button {
            display: inline-block;
            background-color: #10b981;
            color: #ffffff !important;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2), 0 2px 4px -1px rgba(16, 185, 129, 0.10);
            transition: all 0.2s ease;
        }
        .divider {
            height: 1px;
            background-color: #e2e8f0;
            margin: 32px 0;
        }
        .footer {
            background-color: #f8fafc;
            padding: 32px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }
        .footer-text {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 16px 0;
        }
        .footer-logo {
            font-weight: 700;
            color: #334155;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .unsubscribe-link {
            color: #94a3b8;
            text-decoration: underline;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <table role="presentation" width="100%">
            <tr>
                <td align="center">
                    <table class="main-table" role="presentation">
                        <!-- Header Banner -->
                        <tr>
                            <td class="header-bar">
                                <h1 class="header-title">Portfolio Updates</h1>
                                <p class="header-subtitle">New Case Study Published</p>
                            </td>
                        </tr>
                        
                        <!-- Content Area -->
                        <tr>
                            <td class="content-body">
                                <span class="post-label">Case Study</span>
                                <h2 class="post-title">{{.CaseStudy.Case_Study_Title}}</h2>
                                <p class="post-description">{{.CaseStudy.Case_Study_DES}}</p>
                                
                                <div class="cta-container">
                                    <a href="{{.SiteURL}}/casestudy/getcasestudy/slug/{{.CaseStudy.Case_Study_Slug}}" class="cta-button">Read Case Study</a>
                                </div>
                            </td>
                        </tr>

                        <!-- Footer Area -->
                        <tr>
                            <td class="footer">
                                <div class="footer-logo">Chetan Sachan</div>
                                <p class="footer-text">
                                    Thank you for subscribing to my updates. Stay tuned for more project showcases, tech blogs, and case studies!
                                </p>
                                <div class="divider" style="margin: 20px 0;"></div>
                                <a href="{{.SiteURL}}/unsubscribe?email={{.Email}}" class="unsubscribe-link">Unsubscribe</a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
