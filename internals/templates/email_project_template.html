<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Project Showcase: {{.Project.Project_Name}}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        table {
            border-spacing: 0;
            border-collapse: collapse;
            width: 100%;
        }
        td {
            padding: 0;
        }
        img {
            border: 0;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }
        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f8fafc;
            padding-bottom: 40px;
        }
        .main-table {
            background-color: #ffffff;
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }
        .header-bar {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            padding: 40px 20px;
            text-align: center;
        }
        .header-title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .header-subtitle {
            color: #e0f2fe;
            font-size: 14px;
            margin: 8px 0 0 0;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .content-body {
            padding: 40px 32px;
        }
        .post-label {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 9999px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .post-title {
            color: #0f172a;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
            margin: 0 0 16px 0;
        }
        .post-description {
            color: #475569;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 32px 0;
        }
        .cta-container {
            text-align: center;
            margin-bottom: 16px;
        }
        .cta-button {
            display: inline-block;
            background-color: #0ea5e9;
            color: #ffffff !important;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.2), 0 2px 4px -1px rgba(14, 165, 233, 0.1);
            transition: background-color 0.2s ease;
        }
        .footer {
            margin: 0 auto;
            max-width: 600px;
            text-align: center;
            padding: 24px 20px;
        }
        .footer-text {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
            margin: 0 0 12px 0;
        }
        .footer-links {
            margin-top: 16px;
        }
        .footer-link {
            color: #64748b;
            text-decoration: underline;
            font-size: 13px;
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Spacer -->
        <table role="presentation" width="100%">
            <tr>
                <td height="40"></td>
            </tr>
        </table>

        <!-- Main Card -->
        <table class="main-table" role="presentation" align="center">
            <!-- Header -->
            <tr>
                <td class="header-bar">
                    <h1 class="header-title">Developer Portfolio</h1>
                    <p class="header-subtitle">New Project Showcase</p>
                </td>
            </tr>
            <!-- Content -->
            <tr>
                <td class="content-body">
                    <span class="post-label">Latest Project</span>
                    <h2 class="post-title">{{.Project.Project_Name}}</h2>
                    <p class="post-description">{{.Project.Project_DES}}</p>
                    
                    <div class="cta-container">
                        <a href="{{.SiteURL}}/project/{{.Project.Project_Slug}}" class="cta-button" target="_blank">View Project Details</a>
                    </div>
                </td>
            </tr>
        </table>

        <!-- Footer -->
        <table class="footer" role="presentation" align="center">
            <tr>
                <td>
                    <p class="footer-text">
                        You're receiving this because you subscribed to the newsletter at Developer Portfolio.
                    </p>
                    <p class="footer-text">
                        &copy; 2026 Developer Portfolio. All rights reserved.
                    </p>
                    <div class="footer-links">
                        <a href="{{.SiteURL}}" class="footer-link">Visit Website</a>
                        <span style="color: #cbd5e1;">&bull;</span>
                        <a href="{{.SiteURL}}/unsubscribe" class="footer-link">Unsubscribe</a>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
